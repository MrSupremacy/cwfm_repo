routing:
  l2_epsilon: 1.0e-12
  rms_epsilon: 1.0e-6
  temperature: 1.0
  orthogonal_gain: 1.0
  bias_update_rate: 0.001
  tie_break: score_desc_expert_id_asc

variants:
  - {arm: R2, name: default, trainable: false}
  - {arm: R4o, name: default, trainable: true}
  - {arm: R4d, name: default, trainable: true}
  - {arm: G1, name: default, trainable: true}
  - {arm: G2-0.001, name: default, trainable: true, aux_weight: 0.001}
  - {arm: G4, name: default, trainable: true}

