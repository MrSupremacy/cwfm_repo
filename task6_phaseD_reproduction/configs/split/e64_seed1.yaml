split_generation:
  implementation: kmeans_constrained
  k_means_constrained_version: 0.9.1
  scikit_learn_version: 1.9.0
  numpy_version: 2.4.3
  scipy_version: 1.18.0
  ortools_version: 9.15.6755
  joblib_version: 1.5.3
