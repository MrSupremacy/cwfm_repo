[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task6-phasea-fullft"
version = "0.1.0"
description = "Task 6 Phase A full-finetuning routing experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pyarrow==25.0.1", "matplotlib>=3.8,<4", "PyYAML==6.0.3"]

[project.optional-dependencies]
model = ["torch==2.11.0", "transformers==4.57.6", "datasets==3.6.0", "sentencepiece>=0.2,<0.3", "protobuf>=4"]

[project.scripts]
task6 = "task6.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
