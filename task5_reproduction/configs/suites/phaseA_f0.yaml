# Same training/data/metric settings and logical suite identity as main.
# Only the comparison membership changes; the extension schedules two new arms.
extends: [main.yaml]
variants:
  - {arm: R2, name: default, trainable: false}
  - {arm: R2-soft, name: default, trainable: false}
  - {arm: R4, name: default, trainable: true}
  - {arm: R4-R2Init, name: default, trainable: true}
  - {arm: R4-hard, name: default, trainable: true}
  - {arm: G1, name: default, trainable: true}
  - {arm: G2, name: aux_0.001, trainable: true, aux_weight: 0.001}
  - {arm: G4, name: default, trainable: true}
